<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STABILIS | Executive Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --red: #ef4444;
            --green: #22c55e;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            text-align: center;
        }
        .stat {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }
        .label {
            font-size: 0.875rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-container {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
        }
        h2 { color: var(--accent); margin-top: 0; }
        .delta { font-size: 1rem; margin-left: 5px; }
        .delta.down { color: var(--red); }
        .delta.up { color: var(--green); }
    </style>
</head>
<body>
    <div class="header">
        <h1>CASE STABILIS <span style="font-weight: 300; font-size: 1.2rem;">| Stage 1: Baseline Diagnosis</span></h1>
        <div class="label">N.L. Dalmia Decode X - 2026</div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="label">Total Revenue (21)</div>
            <div class="stat">₹ 1.78 B <span class="delta down">▼ 23%</span></div>
        </div>
        <div class="card">
            <div class="label">Trans. Volume</div>
            <div class="stat">323,055 <span class="delta down">▼ 22%</span></div>
        </div>
        <div class="card">
            <div class="label">User Retention</div>
            <div class="stat">60.5% <span class="delta up">▲ Stable</span></div>
        </div>
        <div class="card">
            <div class="label">Concentration Risk</div>
            <div class="stat">68% <span style="font-size: 0.8rem; color: #94a3b8;">(Top 20% Users)</span></div>
        </div>
    </div>

    <div class="charts">
        <div class="chart-container">
            <h2>Revenue Trend (YoY)</h2>
            <canvas id="revenueChart"></canvas>
        </div>
        <div class="chart-container">
            <h2>Customer Segments (RFM)</h2>
            <canvas id="rfmChart"></canvas>
        </div>
    </div>

    <script>
        const ctx1 = document.getElementById('revenueChart').getContext('2d');
        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{
                    label: '2019-20',
                    data: [143, 131, 199, 153, 157, 169, 154, 150, 208, 274, 309, 78],
                    borderColor: '#38bdf8',
                    tension: 0.4
                }, {
                    label: '2020-21',
                    data: [104, 89, 123, 103, 143, 124, 112, 120, 178, 230, 246, 85],
                    borderColor: '#ef4444',
                    tension: 0.4
                }]
            },
            options: {
                plugins: { legend: { labels: { color: '#f8fafc' } } },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        const ctx2 = document.getElementById('rfmChart').getContext('2d');
        new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: ['Champions', 'Loyal Customers', 'At Risk', 'Others'],
                datasets: [{
                    data: [1235, 1344, 1422, 1725],
                    backgroundColor: ['#38bdf8', '#818cf8', '#fbbf24', '#475569'],
                    borderWidth: 0
                }]
            },
            options: {
                plugins: { legend: { position: 'right', labels: { color: '#f8fafc' } } }
            }
        });
    </script>
</body>
</html>
